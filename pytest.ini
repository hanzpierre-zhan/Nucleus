[pytest]
; Los tests viven en tests/ y NO en scratch/ (que contiene paquetes vendorizados
; con sus propios test_*.py). Sin esta línea, un `pytest` sin argumentos arrastra
; scratch/ => por eso aquí se fija el directorio y se excluye explícitamente.
testpaths = tests
norecursedirs = scratch .git __pycache__ instance docs
addopts = -q --strict-markers
markers =
    integracion: usa el test_client de Flask
    postgres: solo se ejecuta contra Postgres
    lento: tarda más de 2 segundos
