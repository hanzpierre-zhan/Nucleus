<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nucleus Mobile · Vista de prueba</title>
  <script src="{{ url_for('static', filename='js/form-pruebas-theme.js',v=2) }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/form-pruebas.css', v=20) }}">
</head>
<body>
  {% set vista_prueba = true %}
  {% include '_nucleus_mobile_cabecera.html' %}
  <main class="shell">
    {% include '_nucleus_mobile_inicio.html' %}
  </main>
  <dialog class="card" id="prueba-clave" aria-labelledby="prueba-clave-titulo">
    <h2 id="prueba-clave-titulo">Cambiar clave</h2>
    <p>La vista de prueba no modifica claves.</p>
    <form method="dialog"><button class="primary">Cerrar</button></form>
  </dialog>
  <dialog class="card" id="prueba-salir" aria-labelledby="prueba-salir-titulo">
    <h2 id="prueba-salir-titulo">Salir</h2>
    <p>La vista de prueba usa la sesión de gestión.</p>
    <form method="dialog"><button class="primary">Cerrar</button></form>
  </dialog>
</body>
</html>
