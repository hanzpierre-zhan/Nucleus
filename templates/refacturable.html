{% extends "base.html" %}
{% block title %}Refacturable · Nucleus{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/refacturable.css') }}?v=2">
<div class="ref-toolbar">
    <span id="ref-count" class="topbar-badge" title="Registros visibles / total">0 / 0</span>
    <div id="ref-pagination" aria-label="Paginación"></div>
    <span class="ref-module-title"><i class="fa-solid fa-file-invoice"></i> Refacturable</span>
    <div class="ref-settings-wrap">
        <button type="button" id="ref-settings-toggle" class="action-pill pill-neutral" aria-expanded="false"><i class="fa-solid fa-gear"></i> Configuración</button>
        <div id="ref-settings" class="col-visibility-menu">
            <button type="button" id="ref-export" class="ref-menu-item"><i class="fa-solid fa-file-excel"></i> Exportar Excel</button>
        </div>
    </div>
</div>
<div id="ref-message" role="status" aria-live="polite"></div>
<div id="ref-grid" class="excel-grid"></div>
<dialog id="ref-editor" aria-labelledby="ref-editor-title">
    <form id="ref-form">
        <header class="ref-modal-header"><div><h2 id="ref-editor-title">Seguimiento refacturable</h2><p id="ref-cotizacion"></p></div><button type="button" class="ref-close" aria-label="Cerrar">×</button></header>
        <div class="ref-modal-body">
            <section class="ref-section"><h3>Montos</h3><div class="ref-form-grid ref-money-grid">
                <label>Monto Cobra<input name="monto_cobra" inputmode="decimal" placeholder="Ingrese el importe"><small>Ingreso manual</small></label>
                <label>Monto HW<input id="ref-hw" readonly><small>Total de la cotización aprobada</small></label>
                <label>Margen<output id="ref-margin">—</output><small>Monto Cobra − Monto HW</small></label>
            </div></section>
            <section class="ref-section"><h3>Seguimiento y cierre</h3><div class="ref-form-grid">
                <label>Fecha de fin<input name="fecha_fin" type="date"></label>
                <label>Estatus<select name="estatus"><option value="">Seleccione</option><option>Pendiente</option><option>Stand by</option><option>Culminado</option></select></label>
                <label>Número Expense<input name="numero_expense" maxlength="200"></label>
                <label>Estado Expense<select name="estado_expense"><option value="">Seleccione</option><option>En borrador</option><option>En revisión</option><option>Observado</option><option>Rechazado</option><option>Aprobado</option><option>Pendiente</option><option>Con PO</option></select></label>
                <label>Mes de cierre<input name="mes_cierre" type="month"></label>
                <label>Número de PO<input name="numero_po" maxlength="200"></label>
                <label class="ref-full-width">Observación<textarea name="observacion" rows="3" maxlength="4000"></textarea></label>
            </div></section>
            <p id="ref-form-error" role="alert"></p>
        </div>
        <footer class="ref-modal-footer"><button type="button" class="action-pill pill-neutral ref-close">Cancelar</button><button type="submit" id="ref-save" class="action-pill pill-teal"><i class="fa-solid fa-check"></i> Guardar cambios</button></footer>
    </form>
</dialog>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/refacturable.js') }}?v=2"></script>{% endblock %}
