{% extends "base.html" %}

{% block content %}
<style>
    .cot-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .cot-card:hover {
        border-color: rgba(99,102,241,0.4);
        box-shadow: 0 4px 24px rgba(99,102,241,0.08);
    }
    .badge-estado {
        display: inline-block; padding: 3px 9px; border-radius: 10px;
        font-size: 11px; font-weight: 600; color: white;
    }
    .modal-overlay {
        position: fixed; top:0; left:0; width:100%; height:100vh;
        background: rgba(0,0,0,0.6); z-index:1000; display:none;
        backdrop-filter: blur(4px); align-items:center; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        width: 480px;
        max-width: 95vw;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .stat-box {
        background: rgba(99,102,241,0.07);
        border: 1px solid rgba(99,102,241,0.18);
        border-radius: 10px;
        padding: 16px 20px;
        text-align: center;
    }
</style>

<!-- CABECERA -->
<div style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
    <div>
        <h1 style="margin:0; color:var(--primary); font-size:22px; display:flex; align-items:center; gap:10px;">
            <i data-lucide="file-text" style="width:22px;height:22px;"></i> Panel de Cotizaciones
        </h1>
        <p style="margin:4px 0 0; color:var(--text-muted); font-size:13px;">
            Aprobación y rechazo de montos. Solo visible para Admin y Supervisor.
        </p>
    </div>
    <div style="display:flex; gap:10px;">
        <div class="stat-box">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">TOTAL</div>
            <div style="font-size:22px; font-weight:700; color:var(--primary);" id="stat-total">0</div>
        </div>
        <div class="stat-box" style="background:rgba(16,185,129,0.07); border-color:rgba(16,185,129,0.18);">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">APROBADAS</div>
            <div style="font-size:22px; font-weight:700; color:#10b981;" id="stat-aprobadas">0</div>
        </div>
        <div class="stat-box" style="background:rgba(239,68,68,0.07); border-color:rgba(239,68,68,0.18);">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">PENDIENTES</div>
            <div style="font-size:22px; font-weight:700; color:#ef4444;" id="stat-pendientes">0</div>
        </div>
        <div class="stat-box" style="background:rgba(245,158,11,0.07); border-color:rgba(245,158,11,0.18);">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">MONTO TOTAL APROBADO</div>
            <div style="font-size:18px; font-weight:700; color:#f59e0b;" id="stat-monto">S/ 0.00</div>
        </div>
    </div>
</div>

<!-- BUSCADOR -->
<div style="margin-bottom:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <div style="position:relative; flex:1; min-width:220px; max-width:360px;">
        <i data-lucide="search" style="position:absolute; left:9px; top:9px; width:14px; height:14px; color:var(--text-muted);"></i>
        <input type="text" id="buscador-cot" placeholder="Buscar por ticket, sitio, gestor..."
            style="padding:7px 10px 7px 32px; border-radius:6px; border:1px solid var(--border);
                   background:rgba(255,255,255,0.05); color:var(--text-main); width:100%; box-sizing:border-box; outline:none; font-size:13px;">
    </div>
    <select id="filtro-estado" style="padding:7px 12px; border-radius:6px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text-main); font-size:13px; font-family:inherit;">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Asignado">Asignado</option>
        <option value="Parada de Reloj">Parada de Reloj</option>
        <option value="Cierre Operativo">Cierre Operativo</option>
        <option value="Liquidado">Liquidado</option>
    </select>
    <span id="cot-contador" style="color:var(--text-muted); font-size:12px;"></span>
</div>

<!-- GRID DE CARDS -->
<div id="grid-cotizaciones" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px;">
    <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">
        <i data-lucide="loader" style="width:24px;height:24px; animation:spin 1s linear infinite;"></i>
        Cargando cotizaciones...
    </div>
</div>

<!-- MODAL APROBAR/RECHAZAR -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <h3 style="margin:0 0 16px; color:var(--primary); font-size:16px; display:flex; align-items:center; gap:8px;" id="modal-titulo">
            <i data-lucide="check-circle" style="width:18px;height:18px;"></i> Aprobar Cotización
        </h3>

        <div id="modal-info" style="background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:16px; font-size:12px; color:var(--text-muted); line-height:1.8;"></div>

        <div id="campo-monto-wrap" style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px; font-size:13px; color:var(--text-muted); font-weight:500;">
                Monto a Aprobar (S/)
            </label>
            <input type="number" step="0.01" id="modal-monto"
                style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text-main); box-sizing:border-box; font-size:14px; font-family:inherit;"
                placeholder="Ej. 1200.00">
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:6px; font-size:13px; color:var(--text-muted); font-weight:500;">
                Comentario (opcional)
            </label>
            <textarea id="modal-comentario" rows="3"
                style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text-main); box-sizing:border-box; font-family:inherit; resize:vertical; font-size:13px;"
                placeholder="Motivo de aprobación o rechazo..."></textarea>
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-main);" onclick="cerrarModal()">
                Cancelar
            </button>
            <button class="btn" id="btn-modal-accion" style="">
                <i data-lucide="check" style="width:15px;height:15px;"></i> Confirmar
            </button>
        </div>
    </div>
</div>

<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block extra_js %}
<script>
    const IS_SUPERVISOR = {{ 'true' if current_user and current_user.rol in ('Admin','Supervisor') else 'false' }};
    let todasCotizaciones = [];
    let modalAccion = null;
    let modalIncidenciaId = null;

    const colores = {
        'Pendiente':        '#ef4444',
        'Asignado':         '#3b82f6',
        'Parada de Reloj':  '#f59e0b',
        'Cierre Operativo': '#8b5cf6',
        'Liquidado':        '#10b981'
    };

    document.addEventListener('DOMContentLoaded', () => {
        cargarCotizaciones();
        document.getElementById('buscador-cot').addEventListener('input', renderCards);
        document.getElementById('filtro-estado').addEventListener('change', renderCards);
    });

    async function cargarCotizaciones() {
        try {
            const req = await fetch('/api/incidencias');
            const todas = await req.json();
            todasCotizaciones = todas.filter(i => i.servicio && i.servicio.trim().toUpperCase() === 'COTIZACION');
            actualizarStats();
            renderCards();
        } catch (err) {
            document.getElementById('grid-cotizaciones').innerHTML =
                '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#ef4444;">Error al cargar datos.</div>';
        }
    }

    function actualizarStats() {
        const total = todasCotizaciones.length;
        const aprobadas = todasCotizaciones.filter(i => i.monto_aprobado !== null && i.estado === 'Asignado').length;
        const pendientes = todasCotizaciones.filter(i => i.estado === 'Pendiente').length;
        const montoTotal = todasCotizaciones.reduce((acc, i) => acc + (i.monto_aprobado || 0), 0);

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-aprobadas').textContent = aprobadas;
        document.getElementById('stat-pendientes').textContent = pendientes;
        document.getElementById('stat-monto').textContent = `S/ ${montoTotal.toFixed(2)}`;
    }

    function renderCards() {
        const q = document.getElementById('buscador-cot').value.toLowerCase();
        const filtroEstado = document.getElementById('filtro-estado').value;
        const grid = document.getElementById('grid-cotizaciones');

        let filtradas = todasCotizaciones;
        if (filtroEstado) {
            filtradas = filtradas.filter(i => i.estado === filtroEstado);
        }
        if (q) {
            filtradas = filtradas.filter(i =>
                (i.numero_ticket || '').toLowerCase().includes(q) ||
                (i.site_name || '').toLowerCase().includes(q) ||
                (i.gestor || '').toLowerCase().includes(q) ||
                (i.descripcion || '').toLowerCase().includes(q) ||
                (i.contrata || '').toLowerCase().includes(q)
            );
        }

        document.getElementById('cot-contador').textContent = `${filtradas.length} registro(s)`;

        if (filtradas.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-muted);"><i data-lucide="inbox" style="width:32px;height:32px; margin-bottom:12px; display:block; margin-left:auto; margin-right:auto;"></i>No hay cotizaciones que coincidan.</div>';
            lucide.createIcons();
            return;
        }

        grid.innerHTML = '';
        filtradas.forEach(i => {
            const badge = colores[i.estado] || '#6b7280';
            const montoAprobado = i.monto_aprobado !== null ? `S/ ${parseFloat(i.monto_aprobado).toFixed(2)}` : '<span style="color:var(--text-muted);">Sin definir</span>';
            const montoGastado  = i.monto_gastado  !== null ? `S/ ${parseFloat(i.monto_gastado).toFixed(2)}`  : '<span style="color:var(--text-muted);">-</span>';

            const card = document.createElement('div');
            card.className = 'cot-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                    <div>
                        <div style="font-weight:700; font-size:15px; color:var(--primary);">${i.numero_ticket}</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${i.fecha_ticket}</div>
                    </div>
                    <span class="badge-estado" style="background:${badge};">${i.estado}</span>
                </div>
                <div style="font-size:12px; color:var(--text-muted); line-height:1.7; margin-bottom:12px;">
                    <div><strong style="color:var(--text-main);">Gestor:</strong> ${i.gestor || '-'}</div>
                    <div><strong style="color:var(--text-main);">Site:</strong> ${i.site_name || '-'}</div>
                    <div><strong style="color:var(--text-main);">Contrata:</strong> ${i.contrata || '-'}</div>
                    <div><strong style="color:var(--text-main);">Depto:</strong> ${i.departamento || '-'} / ${i.ciudad || '-'}</div>
                    <div style="margin-top:4px; padding:8px; background:rgba(255,255,255,0.03); border-radius:6px; border:1px solid rgba(255,255,255,0.05); font-size:11px; color:var(--text-muted); white-space:pre-wrap; line-height:1.5; max-height:60px; overflow:hidden; text-overflow:ellipsis;" title="${i.descripcion}">${i.descripcion}</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                    <div style="background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2); border-radius:8px; padding:10px; text-align:center;">
                        <div style="font-size:10px; color:var(--text-muted); margin-bottom:2px;">MONTO APROBADO</div>
                        <div style="font-size:14px; font-weight:700; color:#10b981;">${montoAprobado}</div>
                    </div>
                    <div style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); border-radius:8px; padding:10px; text-align:center;">
                        <div style="font-size:10px; color:var(--text-muted); margin-bottom:2px;">MONTO GASTADO</div>
                        <div style="font-size:14px; font-weight:700; color:#ef4444;">${montoGastado}</div>
                    </div>
                </div>
                ${IS_SUPERVISOR ? `
                <div style="display:flex; gap:8px;">
                    <button onclick="abrirModal(${i.id}, 'aprobar')" class="btn" style="flex:1; justify-content:center; font-size:12px; padding:8px; background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.4);">
                        <i data-lucide="check-circle" style="width:14px;height:14px;"></i> Aprobar
                    </button>
                    <button onclick="abrirModal(${i.id}, 'rechazar')" class="btn" style="flex:1; justify-content:center; font-size:12px; padding:8px; background:rgba(239,68,68,0.12); color:#ef4444; border:1px solid rgba(239,68,68,0.4);">
                        <i data-lucide="x-circle" style="width:14px;height:14px;"></i> Rechazar
                    </button>
                </div>` : `<div style="text-align:center; font-size:11px; color:var(--text-muted); padding:6px;">Solo Admin/Supervisor puede aprobar.</div>`}
            `;
            grid.appendChild(card);
        });
        lucide.createIcons();
    }

    function abrirModal(id, accion) {
        const inc = todasCotizaciones.find(i => i.id === id);
        if (!inc) return;
        modalAccion = accion;
        modalIncidenciaId = id;

        const esAprobar = accion === 'aprobar';
        document.getElementById('modal-titulo').innerHTML = `<i data-lucide="${esAprobar ? 'check-circle' : 'x-circle'}" style="width:18px;height:18px;"></i> ${esAprobar ? 'Aprobar' : 'Rechazar'} Cotización`;
        document.getElementById('modal-info').innerHTML = `
            <strong style="color:var(--primary);">Ticket:</strong> ${inc.numero_ticket}<br>
            <strong style="color:var(--primary);">Gestor:</strong> ${inc.gestor || '-'}<br>
            <strong style="color:var(--primary);">Site:</strong> ${inc.site_name || '-'}<br>
            <strong style="color:var(--primary);">Monto Actual Aprobado:</strong> ${inc.monto_aprobado !== null ? 'S/ '+parseFloat(inc.monto_aprobado).toFixed(2) : 'Sin definir'}
        `;
        document.getElementById('campo-monto-wrap').style.display = esAprobar ? 'block' : 'none';
        if (esAprobar) {
            document.getElementById('modal-monto').value = inc.monto_aprobado !== null ? inc.monto_aprobado : '';
        }
        document.getElementById('modal-comentario').value = '';

        const btnAccion = document.getElementById('btn-modal-accion');
        btnAccion.style.background = esAprobar ? 'rgba(16,185,129,0.8)' : 'rgba(239,68,68,0.8)';
        btnAccion.style.color = 'white';
        btnAccion.innerHTML = `<i data-lucide="${esAprobar ? 'check' : 'x'}" style="width:15px;height:15px;"></i> ${esAprobar ? 'Aprobar' : 'Rechazar'}`;
        btnAccion.onclick = confirmarAccion;

        document.getElementById('modal-overlay').classList.add('open');
        lucide.createIcons();
    }

    function cerrarModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        modalAccion = null;
        modalIncidenciaId = null;
    }

    async function confirmarAccion() {
        if (!modalAccion || !modalIncidenciaId) return;
        const btn = document.getElementById('btn-modal-accion');
        btn.disabled = true;
        btn.textContent = 'Procesando...';

        const body = { comentario: document.getElementById('modal-comentario').value.trim() };
        if (modalAccion === 'aprobar') {
            const montoStr = document.getElementById('modal-monto').value.trim();
            if (!montoStr) { alert('Por favor ingrese el monto a aprobar.'); btn.disabled=false; return; }
            body.monto_aprobado = parseFloat(montoStr);
        }

        try {
            const req = await fetch(`/api/cotizaciones/${modalIncidenciaId}/${modalAccion}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const res = await req.json();
            if (req.ok && res.success) {
                cerrarModal();
                await cargarCotizaciones();
            } else {
                alert('Error: ' + (res.error || 'No se pudo procesar.'));
            }
        } catch (err) {
            alert('Error de conexión.');
        } finally {
            btn.disabled = false;
        }
    }

    // Cerrar modal al clicar fuera
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) cerrarModal();
    });
</script>
{% endblock %}
