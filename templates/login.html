<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Nucleus</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M 20 26 A 10 10 0 1 1 20 6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='12' cy='10' r='4' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;height:100%;font-family:'Geist Sans','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1A1A1A;color:#F8FAFC;-webkit-font-smoothing:antialiased}
        .vl-page{min-height:100vh;background:#1A1A1A;display:flex;flex-direction:column}
        .vl-top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
        .vl-tri{font-size:18px;color:#6C63FF;letter-spacing:2px}
        .vl-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 60px}
        .vl-box{width:340px;max-width:100%}
        .vl-title{font-size:22px;font-weight:600;text-align:center;margin:0 0 24px;letter-spacing:-0.3px}
        .vl-error{display:flex;align-items:center;gap:8px;justify-content:center;background:#222222;border:1px solid #333333;color:#ff453a;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px}
        .vl-field{position:relative;margin-bottom:12px}
        .vl-field input{width:100%;height:40px;background:#222222;border:1px solid #333333;border-radius:6px;padding:0 40px 0 14px;font-size:14px;color:#F8FAFC;outline:none;transition:border-color .15s}
        .vl-field input::placeholder{color:#64748B}
        .vl-field input:focus{border-color:#6C63FF;background:#222B3F}
        .vl-field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748B;font-size:13px;pointer-events:none}
        .vl-field input.has-icon{padding-left:36px}
        .vl-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:#64748B;cursor:pointer;font-size:13px}
        .vl-eye:hover{color:#F8FAFC}
        body.light .vl-eye{color:#89A3A2 !important}
        body.light .vl-eye:hover{color:#162623 !important}
        .vl-btn{width:100%;height:40px;border-radius:6px;border:1px solid #6C63FF;background:#6C63FF;color:#FFF;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
        .vl-btn:hover{background:#564ED6; border-color:#564ED6}
        .vl-btn:disabled{opacity:.6;cursor:not-allowed}
        .vl-btn-dark{width:100%;height:40px;border-radius:6px;border:1px solid #333333;background:#222222;color:#F8FAFC;font-size:13px;font-weight:500;cursor:pointer;margin-top:10px}
        .vl-btn-dark:hover{background:#2C2C2C;border-color:#6C63FF}
        .vl-link{margin-top:16px;background:none;border:none;color:#94A3B8;font-size:12px;cursor:pointer;text-decoration:underline}
        .vl-link:hover{color:#F8FAFC}
        body.light .vl-link{color:#577877 !important}
        body.light .vl-link:hover{color:#162623 !important}
        .vl-panel{margin-top:12px;border:1px solid #333333;border-radius:8px;padding:16px;background:#222222;display:none}
        .vl-panel input{width:100%;height:36px;background:#1A1A1A;border:1px solid #333333;border-radius:6px;padding:0 12px;margin-bottom:8px;color:#F8FAFC;font-size:13px;outline:none}
        .vl-panel input:focus{border-color:#6C63FF}
        .vl-panel input::placeholder{color:#64748B}
        .vl-msg{margin-top:8px;font-size:12px;display:none}
        .vl-footer{margin-top:32px;text-align:center;font-size:11px;color:#64748B}
        .vl-logo{color:#F8FAFC;display:flex;align-items:center;gap:8px;text-decoration:none}
        .vl-logo svg{color:#6C63FF}
        body.light .vl-logo{color:#162623 !important}
        body.light .vl-logo svg{color:#295255 !important}
        .vl-theme-toggle{position:fixed;bottom:20px;left:20px;width:36px;height:36px;border-radius:50%;border:1px solid #333333;background:#222222;color:#64748B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;z-index:10;transition:all .15s}
        .vl-theme-toggle:hover{color:#F8FAFC;border-color:#6C63FF}
        body.light{background:#F0F5F7 !important;color:#162623 !important}
        body.light .vl-page{background:#F0F5F7 !important}
        body.light .vl-field input{background:#FFFFFF !important;border-color:#CFDCDC !important;color:#162623 !important}
        body.light .vl-field input::placeholder{color:#89A3A2 !important}
        body.light .vl-field input:focus{border-color:#295255 !important; background:#FFFFFF !important}
        body.light .vl-panel{background:#FFFFFF !important;border-color:#CFDCDC !important}
        body.light .vl-panel input{background:#F0F5F7 !important;border-color:#CFDCDC !important;color:#162623 !important}
        body.light .vl-panel input:focus{border-color:#295255 !important}
        body.light .vl-btn{background:#295255 !important;color:#FFF !important;border-color:#295255 !important}
        body.light .vl-btn:hover{background:#1E3F41 !important;border-color:#1E3F41 !important}
        body.light .vl-btn-dark{background:#FFFFFF !important;color:#162623 !important;border-color:#CFDCDC !important}
        body.light .vl-btn-dark:hover{background:#E3EAE9 !important; border-color:#295255 !important}
        body.light .vl-theme-toggle{background:#FFFFFF !important;border-color:#CFDCDC !important;color:#577877 !important}
        body.light .vl-theme-toggle:hover{color:#162623 !important;border-color:#295255 !important}
        .spinner-ring{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="vl-page">
        <div class="vl-top"><a href="/" class="vl-logo"><svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M 20 26 A 10 10 0 1 1 20 6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="4" fill="currentColor"/></svg><span style="font-size:14px;font-weight:700;letter-spacing:1px;">NUCLEUS</span></a></div>
        <div class="vl-center">
            <div class="vl-box">
                <h1 class="vl-title">Log in to Nucleus</h1>
                {% if error %}
                <div class="vl-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
                {% endif %}
                <form method="POST" id="login-form">
                    <div class="vl-field">
                        <input type="text" name="username" placeholder="Usuario" required autocomplete="username">
                    </div>
                    <div class="vl-field">
                        <input type="password" name="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
                        <button type="button" class="vl-eye" onclick="togglePassword()" title="Mostrar"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
                    </div>
                    <button type="submit" class="vl-btn" id="login-btn">Ingresar</button>
                </form>
                <div style="text-align:center">
                    <button type="button" class="vl-link" onclick="toggleCambiar()">Cambiar contraseña</button>
                </div>
                <div id="panel-cambiar" class="vl-panel">
                    <input type="text" id="cp-user" placeholder="Usuario">
                    <input type="password" id="cp-actual" placeholder="Contraseña actual">
                    <input type="password" id="cp-nueva" placeholder="Nueva contraseña (mín 4)">
                    <button type="button" class="vl-btn-dark" onclick="cambiarDesdeLogin()" id="btn-cp">Actualizar contraseña</button>
                    <div id="cp-msg" class="vl-msg"></div>
                </div>
                <div class="vl-footer">© 2026 Nucleus — HPVR</div>
            </div>
        </div>
        <button id="login-theme-toggle" class="vl-theme-toggle" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
    </div>
    <script>
        (function(){const b=document.getElementById('login-theme-toggle');if(!b)return;const ic=b.querySelector('i');const apply=()=>{const light=document.body.classList.contains('light');ic.className=light?'fa-solid fa-moon':'fa-solid fa-sun'};try{if(localStorage.getItem('nucleus-theme')==='light')document.body.classList.add('light')}catch(e){}apply();b.addEventListener('click',()=>{document.body.classList.toggle('light');const light=document.body.classList.contains('light');try{localStorage.setItem('nucleus-theme',light?'light':'dark')}catch(e){}apply()})})();
        function togglePassword(){const p=document.getElementById('password'),i=document.getElementById('eye-icon'),m=p.type==='password';p.type=m?'text':'password';i.className=m?'fa-solid fa-eye-slash':'fa-solid fa-eye'}
        document.getElementById('login-form').addEventListener('submit',function(){const b=document.getElementById('login-btn');b.disabled=true;b.innerHTML='<span class="spinner-ring"></span> Ingresar'});
        function toggleCambiar(){const p=document.getElementById('panel-cambiar');p.style.display=p.style.display==='none'||!p.style.display?'block':'none'}
        async function cambiarDesdeLogin(){
            const u=document.getElementById('cp-user').value.trim(),a=document.getElementById('cp-actual').value,n=document.getElementById('cp-nueva').value,msg=document.getElementById('cp-msg'),btn=document.getElementById('btn-cp');
            msg.style.display='none';msg.textContent='';
            if(!u||!a||!n){msg.textContent='Completa los 3 campos';msg.style.color='#ff453a';msg.style.display='block';return}
            if(n.length<4){msg.textContent='Mínimo 4 caracteres';msg.style.color='#ff453a';msg.style.display='block';return}
            btn.disabled=true;btn.textContent='Actualizando...';
            try{const r=await fetch('/api/auth/cambiar-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,actual:a,nueva:n})});const j=await r.json();if(j.success){msg.style.color='#30d158';msg.textContent='Actualizada, ya puedes iniciar sesión';msg.style.display='block';document.getElementById('cp-actual').value='';document.getElementById('cp-nueva').value=''}else{msg.style.color='#ff453a';msg.textContent=j.error||'Error';msg.style.display='block'}}catch(e){msg.textContent='Error de red';msg.style.color='#ff453a';msg.style.display='block'}
            btn.disabled=false;btn.textContent='Actualizar contraseña';
        }
    </script>
</body>
</html>
