<!-- Aviso de cookies (público): se incluye en login.html y base.html -->
<div id="cookie-banner" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:760px;margin:0 auto;background:#222222;border:1px solid #333333;border-radius:10px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-family:'Geist Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <i class="fa-solid fa-cookie-bite" style="color:#6C63FF;font-size:18px;flex-shrink:0;"></i>
        <div style="flex:1;min-width:220px;font-size:12.5px;line-height:1.5;color:#CBD5E1;">
            Usamos <b style="color:#F8FAFC;">cookies técnicas</b> (sesión) y almacenamiento local para que la aplicación funcione.
            No instalamos analítica ni publicidad de terceros. <a href="/cookies" style="color:#8FA4FF;">Ver política de cookies</a>
        </div>
        <button type="button" id="cookie-accept" style="flex-shrink:0;height:34px;padding:0 18px;border-radius:6px;border:1px solid #6C63FF;background:#6C63FF;color:#FFF;font-size:13px;font-weight:600;cursor:pointer;">Entendido</button>
    </div>
</div>
<script>
(function(){
    var KEY='nucleus-consent';
    var b=document.getElementById('cookie-banner');
    if(!b)return;
    var ok=false;
    try{ok=!!localStorage.getItem(KEY)}catch(e){ok=false}
    if(ok)return;
    b.style.display='block';
    document.getElementById('cookie-accept').addEventListener('click',function(){
        try{localStorage.setItem(KEY,'ok')}catch(e){}
        b.style.display='none';
    });
})();
</script>
